<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Legal — Cenara</title>
<style>
  :root {
    --canvas: #F3F2EC;
    --card: #F9F7F4;
    --ink: #263933;
    --ink-2: #6E7A6C;
    --brand: #3E5341;
    --sage: #E7E8DE;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --canvas: #141914;
      --card: #1E241E;
      --ink: #F2F3EE;
      --ink-2: #9AA69A;
      --brand: #8FAD8C;
      --sage: #25302A;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0 20px 96px;
    background: var(--canvas);
    color: var(--ink);
    font: 17px/1.65 ui-rounded, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 44rem; margin: 0 auto; }
  header { padding: 56px 0 8px; }
  .mark {
    display: inline-flex; align-items: center; gap: 10px;
    text-decoration: none; color: var(--brand); font-weight: 600; font-size: 19px;
  }
  .mark svg { display: block; }
  h1 { font-size: 2.1rem; line-height: 1.2; margin: 28px 0 4px; font-weight: 600; letter-spacing: -0.02em; }
  h2 { font-size: 1.3rem; margin: 40px 0 10px; font-weight: 600; letter-spacing: -0.01em; }
  p, li { color: var(--ink); }
  .updated { color: var(--ink-2); font-size: 0.95rem; margin: 0 0 8px; }
  .note {
    background: var(--sage); border-radius: 16px; padding: 18px 20px;
    color: var(--ink-2); font-size: 0.95rem; margin: 24px 0;
  }
  hr { border: 0; border-top: 1px solid color-mix(in srgb, var(--ink-2) 28%, transparent); margin: 36px 0; }
  a { color: var(--brand); text-underline-offset: 2px; }
  ul { padding-left: 1.25rem; }
  li { margin: 6px 0; }
  strong { font-weight: 650; }
  footer {
    margin-top: 56px; padding-top: 24px;
    border-top: 1px solid color-mix(in srgb, var(--ink-2) 28%, transparent);
    color: var(--ink-2); font-size: 0.9rem;
  }
  footer a { color: var(--ink-2); }
</style>
</head>
<body>
<main>
<header>
  <a class="mark" href="./">
    <svg width="22" height="19" viewBox="0 0 34 22" aria-hidden="true">
      <path fill="currentColor" d="M17 22 C 9 16, 8 6, 10 0 C 16 3, 18 12, 17 22 Z"/>
      <path fill="currentColor" d="M17 22 C 25 16, 26 6, 24 0 C 18 3, 16 12, 17 22 Z"/>
    </svg>
    Cenara
  </a>
</header>
<h1>Cenara</h1>
<p class="updated">Photograph what you have. Get recipes built around it.</p>
<p>Legal documents for the Cenara iPhone app:</p>
<ul>
  <li><a href="privacy.html">Privacy Policy</a></li>
  <li><a href="terms.html">Terms of Service</a></li>
</ul>
<p>Questions, or anything that looks wrong:
<a href="mailto:chris.thompson899@gmail.com">chris.thompson899@gmail.com</a></p>

<footer>
  <p><a href="./">Cenara</a> &middot; <a href="privacy.html">Privacy</a> &middot; <a href="terms.html">Terms</a><br>
  Questions: <a href="mailto:chris.thompson899@gmail.com">chris.thompson899@gmail.com</a></p>
</footer>
</main>
</body>
</html>
